<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000108" />
    <meta name="description" content="Nachrichtenraum, eine WebXR-Erfahrung über digitale Reizüberflutung." />
    <title>Nachrichtenraum</title>
    <link rel="stylesheet" href="./src/styles.css?v=7" />
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <main id="app">
      <a-scene
        id="xr-scene"
        background="color: #000108"
        fog="type: exponential; color: #000108; density: 0.018"
        renderer="antialias: true; colorManagement: true; highRefreshRate: true; physicallyCorrectLights: false; maxCanvasWidth: 2560; maxCanvasHeight: 1440"
        webxr="referenceSpaceType: local-floor; optionalFeatures: local-floor, bounded-floor"
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-entity id="rig">
          <a-camera
            id="viewer"
            position="0 1.6 0"
            look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true"
            wasd-controls="acceleration: 18"
          ></a-camera>
          <a-entity
            id="right-controller"
            meta-touch-controls="hand: right; model: false"
            oculus-touch-controls="hand: right; model: false"
          >
            <a-entity
              id="controller-cursor"
              position="0 0 -0.08"
              geometry="primitive: triangle; vertexA: 0.032 0.042 0; vertexB: -0.022 -0.032 0; vertexC: 0.025 -0.017 0"
              material="color: #ffffff; shader: flat; side: double; transparent: true; opacity: 0.96"
            ></a-entity>
          </a-entity>
        </a-entity>
        <a-entity id="data-swarm"></a-entity>
        <a-entity id="news-root"></a-entity>
      </a-scene>

      <section id="start-screen" aria-labelledby="title">
        <div class="start-content">
          <p class="eyebrow">PUNKT E</p>
          <h1 id="title">Nachrichtenraum</h1>
          <p class="intro">Eine 360°-Erfahrung über digitale Reizüberflutung.</p>
          <button id="start-button" type="button">START</button>
          <button id="vr-button" type="button">IN VR STARTEN</button>
          <p class="hint">Kopfhörer empfohlen</p>
        </div>
      </section>

      <section id="hud" aria-live="polite">
        <div>
          <span id="phase-label">BEREIT</span>
          <span id="timer">00:00</span>
        </div>
        <div>
          <span id="message-count">0 NACHRICHTEN</span>
          <span id="feed-status">RSS WIRD GELADEN</span>
        </div>
      </section>

      <aside id="desktop-help">
        <span>MAUS: 360° BLICK</span>
        <span>WASD: BEWEGEN</span>
        <span>X: SCHLIESSEN</span>
      </aside>
    </main>
    <script type="module" src="./src/main.js?v=11"></script>
  </body>
</html>
